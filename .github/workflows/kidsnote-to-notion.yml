# Kidsnote → Notion mirror
#
# Runs on a 6h cron. Each run logs in to kidsnote with KIDSNOTE_USERNAME /
# KIDSNOTE_PASSWORD through the same JSON API the web login page uses, so
# there is no cookie to refresh. KIDSNOTE_SESSION_COOKIE (a `sessionid`
# copied from a browser, valid 14 days after login) is only a fallback for
# accounts that can't log in headlessly, e.g. with 2-step verification on.
#
# Dedup: each new Notion page records the kidsnote `Report ID`. Subsequent
# runs query the DB once at startup and skip reports whose id is already
# stored, so re-running is safe and idempotent.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   KIDSNOTE_USERNAME         kidsnote login id
#   KIDSNOTE_PASSWORD         kidsnote password
#                             (or KIDSNOTE_SESSION_COOKIE: `sessionid` cookie, expires in 14 days)
#   KIDSNOTE_CHILD_NAME       the child's name (or part of it)
#   NOTION_TOKEN              Notion connection token (app.notion.com/developers/connections)
#   NOTION_DATABASE_ID        link of the Notion page to back up into (a blank page is fine:
#                             its database is created on the first run), or a database id
#   AI_FEATURES               on / off
# More children in the same fork: KIDSNOTE_CHILD_NAME_N + NOTION_DATABASE_ID_N
# (N = 2-5); the plan job starts one parallel backup job per child.

name: Kidsnote → Notion mirror

on:
  workflow_dispatch:
    inputs:
      # Layout principle (2026-05-23 user feedback): default values reflect
      # the "happy path" — leave everything as-is to get the full backup
      # with AI dashboards. Operators only flip a value when they want
      # something OFF. Descriptions are Korean and explain what each
      # option does in plain language.
      limit:
        description: "최근 N개 알림장만 백업 (전체 백업이면 비워두세요. 예: 3 입력 시 최근 3개만)"
        required: false
        default: ""
      monthly_sample:
        description: "🧪 빠른 확인 모드 — 매달 알림장 1개씩만 받아서 셋업이 잘 됐는지 5분 안에 보고 싶을 때. 평소엔 off."
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]
      force_refresh:
        description: "🔄 처음부터 다시 — 노션에 있는 알림장 페이지를 전부 지우고 새로 받기. AI 품질 개선 후 옛날 페이지에도 적용하고 싶을 때만. 평소엔 off."
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]
      relabel:
        description: "🏷️ 예전 페이지 문구 고치기 — 이미 백업된 알림장에 남은 영어 코드(watery 등)나 옛 표현을 키즈노트 표현으로 고칩니다. 페이지·사진·링크는 그대로. 코드 업데이트 후 한 번만. 평소엔 off."
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]
      # ---- Multi-child accounts ----
      # Like the AI master toggle, the child selector now lives in repo
      # Secrets/Variables (``KIDSNOTE_CHILD_NAME``) rather than as a
      # workflow_dispatch input. Reason (2026-05-27 user feedback):
      # schedule cron events don't see ``inputs.*``, so a form-only
      # toggle silently fell back to "first child the API returns" on
      # every cron cycle. Operators with twins/siblings had to wake up
      # and re-dispatch manually each time. Single source of truth via
      # secret keeps cron and manual dispatch in sync without surprise.
      #
      # ``KIDSNOTE_CHILD_NAME`` = name substring (e.g. "하린"). More children
      # in the same fork: ``KIDSNOTE_CHILD_NAME_2`` + ``NOTION_DATABASE_ID_2``
      # (up to _5); the plan job starts one parallel job per child. GitHub
      # allows only one fork per account, so there is no fork-per-child.

      # ---- AI master toggle: secret/variable AI_FEATURES (only) ----
      # The AI master toggle lives ONLY in repo Secrets/Variables now —
      # not as a workflow_dispatch input. Rationale (2026-05-27 user
      # feedback): the previous design had BOTH an ``inputs.use_ai_features``
      # toggle AND a ``vars.AI_FEATURES`` fallback for cron events.
      # Operators kept asking "which one wins? do I need to flip both?"
      # The duplication was inevitable because cron schedule events
      # don't have an ``inputs`` context — so the secret/variable was
      # the only thing the cron path could read. Rather than keep the
      # ambiguous double toggle, we drop the input and standardize on
      # the secret. Single source of truth: set/remove the secret
      # ``AI_FEATURES=on`` and that's the entire toggle.
      #
      # Advanced operators who want to skip a single AI dashboard (e.g.
      # the graduation thank-you card reads awkwardly mid-year) can add
      # the matching DISABLE secret directly:
      #   DISABLE_GROWTH_STORY=true   → skip 📖 매월 성장 스토리
      #   DISABLE_MILESTONES=true     → skip 🌟 마일스톤
      #   DISABLE_INTERESTS=true      → skip 🌱 분기별 관심사
      #   DISABLE_TEACHER_THANKS=true → skip 💌 연도별 선생님께
      # These were workflow_dispatch inputs prior to 2026-05-27 but
      # were removed at the same time as use_ai_features for the same
      # single-source-of-truth reason — the cron path never had access
      # to them anyway, so keeping them as inputs was misleading.
  # Auto-resume: a 1-year backfill can take 18-30 hours of compute,
  # but a GitHub-hosted runner caps a single job at 6 hours. Without
  # cron, the user would have to manually re-trigger after every cap.
  # With this schedule the workflow self-resumes every 4 hours; the
  # script tracks elapsed time and exits cleanly at 5h30m so the next
  # cron run can pick up via dedup. Once the backup is complete each
  # cron run finishes in ~1-2 minutes (no new alimnotas to process).
  # 2026-05-25: cron interval widened 4h → 6h. Each cycle does ~5h work
  # (publish loop + dashboards within the 6h GHA cap). At 4h interval,
  # consecutive cycles queued up and the older ones got auto-cancelled —
  # losing in-flight Notion commits and confusing operators ("backup
  # stopped at date X"). At 6h interval, each cycle has time to drain
  # before the next one fires.
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read
  # actions: write lets the keepalive step below re-enable this
  # workflow so GitHub's 60-day inactivity rule can't switch cron off.
  actions: write

concurrency:
  group: kidsnote-to-notion
  cancel-in-progress: false

jobs:
  # Which children to back up: always slot 1 (its check reports missing
  # settings), plus slot N when the NOTION_DATABASE_ID_N secret is set. Only
  # slot labels leave this job, never secret values.
  plan:
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.find.outputs.slots }}
    steps:
      - name: Find configured children
        id: find
        env:
          DB_2: ${{ secrets.NOTION_DATABASE_ID_2 }}
          DB_3: ${{ secrets.NOTION_DATABASE_ID_3 }}
          DB_4: ${{ secrets.NOTION_DATABASE_ID_4 }}
          DB_5: ${{ secrets.NOTION_DATABASE_ID_5 }}
        run: |
          slots='[{"suffix":"","label":"1"}'
          for n in 2 3 4 5; do
            var="DB_$n"
            if [ -n "$(printf '%s' "${!var}" | tr -d '[:space:]')" ]; then
              slots="$slots,{\"suffix\":\"_$n\",\"label\":\"$n\"}"
            fi
          done
          echo "slots=$slots]" >> "$GITHUB_OUTPUT"

  # One job per child, in parallel. Child N reads KIDSNOTE_CHILD_NAME_N and
  # NOTION_DATABASE_ID_N; NOTION_TOKEN_N falls back to NOTION_TOKEN, so one
  # Notion connection can serve every child's page.
  mirror:
    needs: plan
    name: 백업 (자녀 ${{ matrix.slot.label }})
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours regardless; fetch.py exits cleanly
    # before that and the next cron run resumes where it left off.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.slots) }}

    steps:
      - uses: actions/checkout@v4

      # Check everything a run needs before installing anything (stdlib-only
      # script): kidsnote login, KIDSNOTE_CHILD_NAME, Notion token and page
      # access. A problem ends the run in seconds with a Korean hint; on
      # success the fresh kidsnote sessionid is exported (masked) to later
      # steps as KIDSNOTE_SESSION_COOKIE.
      - name: Check login and settings
        id: auth
        env:
          KIDSNOTE_USERNAME: ${{ secrets.KIDSNOTE_USERNAME }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
          KIDSNOTE_SESSION_COOKIE: ${{ secrets.KIDSNOTE_SESSION_COOKIE }}
          KIDSNOTE_CHILD_NAME: ${{ secrets[format('KIDSNOTE_CHILD_NAME{0}', matrix.slot.suffix)] || vars[format('KIDSNOTE_CHILD_NAME{0}', matrix.slot.suffix)] || '' }}
          NOTION_TOKEN: ${{ secrets[format('NOTION_TOKEN{0}', matrix.slot.suffix)] || secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets[format('NOTION_DATABASE_ID{0}', matrix.slot.suffix)] }}
        run: python3 tools/kidsnote_fetch/preflight.py --github

      # One email per outage instead of one every 6 hours: this fails (so
      # GitHub sends one failure email) only if the previous run didn't
      # already report the login failure; otherwise the run ends green with
      # a warning. Fixing the secret is enough, the next run resumes.
      # !cancelled(): also report when the login step itself crashed.
      - name: Kidsnote login failed - notify once
        if: ${{ !cancelled() && steps.auth.outputs.ok != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_NAME: 백업 (자녀 ${{ matrix.slot.label }})
          REASON: ${{ steps.auth.outputs.reason }}
          HINT: ${{ steps.auth.outputs.hint }}
        run: python3 tools/kidsnote_fetch/notify_once.py

      - name: Set up Python
        if: steps.auth.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fetcher deps + image helpers
        if: steps.auth.outputs.ok == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/kidsnote_fetch/requirements.txt
          # Pillow + piexif for in-memory EXIF strip + auto-compress
          # to Notion's 5 MiB per-file cap.
          pip install pillow piexif

      # ---- Ollama for body summary + LLM dashboards ----
      # Local LLM runs inside the runner — no API key / cost.
      #
      # llama3.1:8b (~4.7GB): reverted from qwen2.5:14b on 2026-05-23
      # after production runs proved 14B is too slow on the GHA CPU
      # runner — alimnota publish + 4 LLM dashboards consistently ran
      # 7-9 hours, hitting the 6h hard cap mid-dashboard and blocking
      # subsequent cron runs (concurrency was queueing then cancelling).
      # The new defensive filters (cjk + english_leak + input_copy +
      # retry-with-temperature) make 8B's quality acceptable; we trade
      # the 14B perspective wins for a backup that actually finishes.
      #
      # When ``AI_FEATURES`` secret/variable is unset or 'off', the
      # cache + pull steps below are skipped so AI-opt-out runs don't
      # pay the ~5min model-pull cost.
      # ``effective_ai`` reads the master AI toggle from repo Secrets
      # or Variables. The input has been retired — single source of
      # truth is ``AI_FEATURES`` (Secrets or Variables tab, either
      # works). cron schedule events read the same value, so manual
      # dispatch and cron stay in sync without any second toggle.
      - name: Resolve effective AI toggle
        id: ai
        if: steps.auth.outputs.ok == 'true'
        env:
          REPO_VAR_AI: ${{ vars.AI_FEATURES }}
          REPO_SECRET_AI: ${{ secrets.AI_FEATURES }}
          GROWTH_STORY: ${{ secrets.GROWTH_STORY || vars.GROWTH_STORY }}
          MILESTONES: ${{ secrets.MILESTONES || vars.MILESTONES }}
          INTERESTS: ${{ secrets.INTERESTS || vars.INTERESTS }}
          TEACHER_THANKS: ${{ secrets.TEACHER_THANKS || vars.TEACHER_THANKS }}
        run: |
          # Forgiving on/off: "On", " on", "켜기" all count, so a stray space or
          # capital letter in a secret doesn't silently flip a setting.
          norm() { printf '%s' "$1" | sed 's/\xEF\xBB\xBF//g' | tr -d "[:space:]\"'" | tr '[:upper:]' '[:lower:]'; }
          is_on()  { case "$(norm "$1")" in on|true|yes|y|1|켜기|켬) return 0 ;; esac; return 1; }
          is_off() { case "$(norm "$1")" in off|false|no|n|0|끄기|끔) return 0 ;; esac; return 1; }
          if is_on "$REPO_VAR_AI" || is_on "$REPO_SECRET_AI"; then ai=on; else ai=off; fi
          echo "value=$ai" >> "$GITHUB_OUTPUT"
          for name in GROWTH_STORY MILESTONES INTERESTS TEACHER_THANKS; do
            if is_off "${!name}"; then disabled=true; else disabled=false; fi
            echo "disable_$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')=$disabled" >> "$GITHUB_OUTPUT"
          done

      - name: Cache Ollama models
        id: ollama-cache
        if: ${{ steps.ai.outputs.value == 'on' }}
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-llama3.1-8b-v2

      - name: Install Ollama + pull model
        if: ${{ steps.ai.outputs.value == 'on' }}
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          # Start ollama in background
          ollama serve > /tmp/ollama.log 2>&1 &
          # Wait for ready (max 30s)
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/version >/dev/null 2>&1; then
              echo "ollama ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Pull model (cached after first run, ~5min first time)
          ollama pull llama3.1:8b

      - name: Mirror Kidsnote → Notion
        if: steps.auth.outputs.ok == 'true'
        env:
          # KIDSNOTE_SESSION_COOKIE comes from $GITHUB_ENV (set by the
          # "Check login and settings" step). Setting it here would override it.
          NOTION_TOKEN: ${{ secrets[format('NOTION_TOKEN{0}', matrix.slot.suffix)] || secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets[format('NOTION_DATABASE_ID{0}', matrix.slot.suffix)] }}
          # Tell notion_mirror.py where Ollama lives + which model to use
          OLLAMA_HOST: "http://localhost:11434"
          OLLAMA_MODEL: "llama3.1:8b"
          PYTHONUNBUFFERED: "1"
          # ---- Multi-child / LLM-skip env passthrough ----
          # Master AI toggle: comes from steps.ai.outputs.value, which
          # reads the AI_FEATURES secret/variable. Same source for
          # workflow_dispatch AND cron. Per-dashboard skips: secrets/
          # variables use the positive on/off form (GROWTH_STORY=off etc)
          # to match AI_FEATURES; the workflow inverts here so the
          # downstream fetch.py keeps reading the existing DISABLE_*
          # env names. Default behavior when the secret isn't set is
          # ``on`` (= DISABLE=false) so the AI on path lights up all 4
          # dashboards out of the box.
          KIDSNOTE_CHILD_NAME: ${{ secrets[format('KIDSNOTE_CHILD_NAME{0}', matrix.slot.suffix)] || vars[format('KIDSNOTE_CHILD_NAME{0}', matrix.slot.suffix)] || '' }}
          DISABLE_ALL_LLM: ${{ steps.ai.outputs.value == 'on' && 'false' || 'true' }}
          DISABLE_GROWTH_STORY: ${{ steps.ai.outputs.disable_growth_story }}
          DISABLE_MILESTONES: ${{ steps.ai.outputs.disable_milestones }}
          DISABLE_INTERESTS: ${{ steps.ai.outputs.disable_interests }}
          DISABLE_TEACHER_THANKS: ${{ steps.ai.outputs.disable_teacher_thanks }}
        run: |
          set -eu
          ARGS=( "--auth-mode" "session-cookie-env" "--publish-to-notion" "--no-local-save" )
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS+=( "--limit" "${{ inputs.limit }}" )
          fi
          if [ "${{ inputs.monthly_sample }}" = "on" ]; then
            ARGS+=( "--monthly-sample" )
          fi
          if [ "${{ inputs.force_refresh }}" = "on" ]; then
            ARGS+=( "--force-refresh" )
          fi
          if [ "${{ inputs.relabel }}" = "on" ]; then
            ARGS+=( "--relabel-existing" )
          fi
          python tools/kidsnote_fetch/fetch.py "${ARGS[@]}"

      - name: Verify required secrets were present
        if: failure() && steps.auth.outputs.ok == 'true'
        env:
          NOTION_TOKEN: ${{ secrets[format('NOTION_TOKEN{0}', matrix.slot.suffix)] || secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets[format('NOTION_DATABASE_ID{0}', matrix.slot.suffix)] }}
        run: |
          for s in NOTION_TOKEN NOTION_DATABASE_ID; do
            if [ -z "${!s:-}" ]; then
              echo "::error::repo secret '$s' is empty or unset"
            fi
          done

      # GitHub auto-disables scheduled workflows after 60 days without
      # repo activity. That silently stopped this mirror on 2026-08-20
      # (last commit 2026-05-28), so an expired cookie went unnoticed.
      # Re-enabling via the API resets the inactivity timer without a
      # dummy commit. always(): keep the schedule alive even when the
      # mirror step fails — a red run that emails the operator beats a
      # schedule that quietly disappears.
      - name: Keep cron schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/kidsnote-to-notion.yml/enable"
