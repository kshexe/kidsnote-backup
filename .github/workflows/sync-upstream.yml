name: Sync fork with redchupa/kidsnote-backup

on:
  schedule:
    # 00:00 KST daily (= 15:00 UTC the previous day).
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from upstream (redchupa/kidsnote-backup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub's own "sync fork" API (same one behind the web UI's Sync
          # fork button) - a fast-forward-only merge done server-side.
          curl -fsSL -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}'
