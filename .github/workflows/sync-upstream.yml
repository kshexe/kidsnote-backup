name: Sync fork with redchupa/kidsnote-backup

on:
  schedule:
    # 00:00 KST daily (= 15:00 UTC the previous day).
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream (redchupa/kidsnote-backup) into main
        run: |
          set -euo pipefail
          # A real git merge, not GitHub's fast-forward-only "sync fork" API: this fork carries
          # its own commits on top of upstream (starting with this very workflow file), so a
          # fast-forward is never possible again once that first commit landed - the API call
          # this replaced failed with 422 every day for exactly that reason.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/redchupa/kidsnote-backup.git
          git fetch upstream main
          git merge upstream/main --no-edit
          git push origin main
